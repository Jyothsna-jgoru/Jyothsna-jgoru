name: Refresh profile art

# Only the heatmap is automated — it is the one piece whose source data
# changes on its own. The portrait and the info card are regenerated by hand
# when their content changes, so this workflow never touches them.
on:
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The fetch and render scripts use only the standard
      # library, so there is nothing to install and no secret to configure:
      # /users/<login>/contributions and LeetCode's userCalendar are public.
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py "${{ github.repository_owner }}"

      # LeetCode can refuse CI runners; if it does, keep yesterday's
      # data/leetcode.json and still render the heatmap.
      - name: Fetch LeetCode submissions
        continue-on-error: true
        run: python scripts/fetch_leetcode.py Jyothsna_G

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh contribution heatmap [skip ci]"
          file_pattern: data/contributions.json data/leetcode.json assets/contrib-heatmap.svg
